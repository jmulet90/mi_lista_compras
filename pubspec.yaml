name: buy_and_stock
description: "Buy&Stock - lista de compras e inventario de despensa."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  cloud_firestore: ^5.6.12
  google_sign_in: ^6.2.1
  image_picker: ^1.0.7
  path_provider: ^2.1.5
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  cupertino_icons: ^1.0.8
  google_fonts: ^8.2.1
  in_app_purchase: ^3.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.8
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/logo.png
    - assets/images/emojis/categories/
    - assets/images/emojis/products/
    # Las carpetas NO se incluyen en recursivo: una línea por categoría.
    - assets/images/emojis/products/kitchen/
    - assets/images/emojis/products/personal_care/
    - assets/images/emojis/products/cleaning/
    - assets/images/emojis/products/meats/
    - assets/images/emojis/products/drinks/
    - assets/images/emojis/products/breakfast/
    - assets/images/emojis/products/fruits/
    - assets/images/emojis/products/vegetables/

flutter_launcher_icons:
  image_path: "assets/icons/app_icon.png"
  android: "launcher_icon"
  min_sdk_android: 21
  adaptive_icon_background: "#059669"
  adaptive_icon_foreground: "assets/icons/app_icon.png"