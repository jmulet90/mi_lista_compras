workflows:
  ios-debug-simulator:
    name: iOS Debug en Simulador
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      cocoapods: default
      flutter: stable
    scripts:
      - name: Obtener dependencias
        script: flutter pub get
      - name: Listar simuladores disponibles
        script: xcrun simctl list devices available | grep iPhone
      - name: Bootear simulador
        script: |
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          for runtime, devices in data['devices'].items():
              for d in devices:
                  if d['name'] == 'iPhone 15' and d['isAvailable']:
                      print(d['udid'])
                      break
          ")
          echo "Simulator ID: $DEVICE_ID"
          xcrun simctl boot "$DEVICE_ID"
      - name: Compilar para simulador
        script: flutter build ios --simulator --debug
      - name: Instalar app en simulador
        script: |
          DEVICE_ID=$(xcrun simctl list devices booted -j | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          for runtime, devices in data['devices'].items():
              for d in devices:
                  if d['state'] == 'Booted':
                      print(d['udid'])
                      break
          ")
          xcrun simctl install "$DEVICE_ID" build/ios/iphonesimulator/Runner.app
      - name: Lanzar app y capturar logs
        timeout: 120
        script: |
          DEVICE_ID=$(xcrun simctl list devices booted -j | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          for runtime, devices in data['devices'].items():
              for d in devices:
                  if d['state'] == 'Booted':
                      print(d['udid'])
                      break
          ")
          BUNDLE_ID=$(defaults read build/ios/iphonesimulator/Runner.app/Info.plist CFBundleIdentifier)
          xcrun simctl launch --console "$DEVICE_ID" "$BUNDLE_ID" 2>&1 | head -200
    artifacts:
      - build/ios/iphonesimulator/Runner.app

  ios-ipa:
    name: iOS IPA
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      cocoapods: default
      flutter: stable
    scripts:
      - name: Obtener dependencias
        script: flutter pub get
      - name: Compilar iOS sin firma
        script: flutter build ios --release --no-codesign
      - name: Empaquetar IPA
        script: |
          cd build/ios/iphoneos
          mkdir Payload
          cp -r Runner.app Payload/
          zip -r $CM_BUILD_DIR/buy_and_stock.ipa Payload
    artifacts:
      - buy_and_stock.ipa
